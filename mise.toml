[tools]
node = "22.23.4"
lefthook = "2.2.2"
yq = "4.54.1"

[tasks.fix]
run = "sh -c 'pnpm exec eslint --fix --no-warn-ignored \"$@\" && pnpm exec prettier --write --ignore-unknown \"$@\"' fix"

[tasks.check]
run = "pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run build && pnpm run test:run"

[tasks.fast]
run = "pnpm run fast"

[tasks.build]
run = "pnpm run build"

[tasks.dev]
run = "pnpm run dev"

[tasks.start]
depends = ["build"]
run = "pnpm run preview"
