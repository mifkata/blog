# Generated from the ci-checks.yml manifests; change a manifest and regenerate, never this file.
# sources: ci-checks.yml tools/repo/ci-checks.yml
# hash: 2f16d2401d16c5eb
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: tools
        run: |
          mise install
          if command -v corepack >/dev/null; then corepack enable --install-directory "$HOME/.local/bin"; fi
      - name: install
        run: "pnpm install --frozen-lockfile"
      - name: "typecheck"
        run: "pnpm run typecheck"
      - name: "test"
        run: "pnpm run test:run"
      - name: "lint"
        run: "pnpm run lint"
      - name: "format"
        run: "pnpm run format"
      - name: "build"
        run: "pnpm run build"
      - name: "storybook"
        run: "pnpm run storybook:build"

  repo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/repo
    env:
      MISE_ENABLE_TOOLS: "yq"
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: tools
        run: |
          mise install
          if command -v corepack >/dev/null; then corepack enable --install-directory "$HOME/.local/bin"; fi
      - name: install
        run: "true"
      - name: "toolchain"
        run: "./toolchain.sh"

  ci-ok:
    if: ${{ always() }}
    needs: [web, repo]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job ended: $result"; exit 1 ;;
            esac
          done
